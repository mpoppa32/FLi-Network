<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLi SOLUTIONS — Defense & Strategic Advisory</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* RESET & CORE CANVAS */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 40%, #1a1612 0%, #0a0907 60%, #030302 100%) !important;
      background-attachment: fixed !important;
      color: #e6dfd3;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* 3D GLOBE CONTAINER */
    #canvas-container, canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.85;
    }

    /* HERO WRAPPER */
    .hero-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem;
      text-align: center;
    }

    /* HEADER BAR */
    .header-bar {
      width: 100%;
      max-width: 1400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: #c5a059;
    }

    .brand-logo {
      font-weight: 700;
      font-size: 1.2rem;
      color: #f5f0e6;
      letter-spacing: 3px;
      border: 1px solid rgba(197, 160, 89, 0.4);
      padding: 6px 12px;
      background: rgba(10, 9, 7, 0.6);
      backdrop-filter: blur(8px);
    }

    /* MAIN UNIFIED HEADLINE */
    .hero-title {
      font-family: 'Space Grotesk', sans-serif !important;
      font-weight: 700 !important;
      font-style: normal !important;
      font-size: clamp(2.2rem, 5.5vw, 4.2rem) !important;
      line-height: 1.15;
      text-transform: uppercase;
      letter-spacing: 6px;
      color: #f5f0e6;
      max-width: 1100px;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.95);
      margin: 2rem 0 1rem 0;
    }

    /* SUBTITLE & DESCRIPTION */
    .hero-subtext {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      font-weight: 400;
      color: rgba(230, 223, 211, 0.8);
      max-width: 720px;
      margin: 0 auto 2rem auto;
      line-height: 1.6;
      letter-spacing: 0.5px;
    }

    .tag-strip {
      font-family: 'Space Mono', monospace;
      color: #c5a059;
      font-size: 0.8rem;
      letter-spacing: 3px;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    /* FOOTER BAR / METADATA */
    .footer-bar {
      width: 100%;
      max-width: 1400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: rgba(197, 160, 89, 0.8);
    }

    .sensor-btn {
      font-family: 'Space Mono', monospace;
      background: rgba(10, 9, 7, 0.7);
      border: 1px solid rgba(197, 160, 89, 0.5);
      color: #f5f0e6;
      padding: 10px 20px;
      font-size: 0.75rem;
      letter-spacing: 2px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .sensor-btn:hover {
      background: rgba(197, 160, 89, 0.15);
      border-color: #c5a059;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND GLOBE LAYER -->
  <div id="canvas-container"></div>

  <!-- HERO CONTENT LAYER -->
  <main class="hero-container">
    
    <header class="header-bar">
      <div class="brand-logo">FLi</div>
      <div>DEFENSE & STRATEGIC ADVISORY</div>
      <div>WASHINGTON D.C.</div>
    </header>

    <section>
      <div class="tag-strip">ACCESS &bull; MOVEMENT &bull; OUTCOME</div>
      <h1 class="hero-title">NETWORK MOBILITY SOLUTIONS.</h1>
      <p class="hero-subtext">
        The network that opens the door, moves the right capability to it, and delivers the outcome — for government and mission-driven problems worldwide.
      </p>
    </section>

    <footer class="footer-bar">
      <div>LAT 7.4°S &nbsp; LON 72.8°W &nbsp; [TRACKING]</div>
      <button class="sensor-btn">&bull; SENSOR VIEW</button>
    </footer>

  </main>

</body>
</html>
