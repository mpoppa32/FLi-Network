<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLi SOLUTIONS — Defense & Strategic Advisory</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    /* RESET & CORE CANVAS */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 45%, #1f1b15 0%, #0b0907 60%, #030302 100%) !important;
      background-attachment: fixed !important;
      color: #e6dfd3;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* 3D GLOBE CONTAINER */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* HERO WRAPPER */
    .hero-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    /* HEADER BAR */
    .header-bar {
      width: 100%;
      max-width: 1400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: #c5a059;
    }

    .brand-logo {
      font-weight: 700;
      font-size: 1.2rem;
      color: #f5f0e6;
      letter-spacing: 3px;
      border: 1px solid rgba(197, 160, 89, 0.4);
      padding: 6px 14px;
      background: rgba(10, 9, 7, 0.65);
      backdrop-filter: blur(8px);
    }

    /* MAIN UNIFIED HEADLINE */
    .hero-title {
      font-family: 'Space Grotesk', sans-serif !important;
      font-weight: 700 !important;
      font-style: normal !important;
      font-size: clamp(2.5rem, 5.8vw, 4.5rem) !important;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 6px;
      color: #f5f0e6;
      max-width: 1100px;
      text-shadow: 0 10px 35px rgba(0, 0, 0, 0.95);
      margin: 2rem auto 1.5rem auto;
    }

    /* SUBTITLE & DESCRIPTION */
    .hero-subtext {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1rem, 1.6vw, 1.2rem);
      font-weight: 400;
      color: rgba(230, 223, 211, 0.85);
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.6;
      letter-spacing: 0.5px;
    }

    .tag-strip {
      font-family: 'Space Mono', monospace;
      color: #c5a059;
      font-size: 0.8rem;
      letter-spacing: 3px;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    /* FOOTER BAR / METADATA */
    .footer-bar {
      width: 100%;
      max-width: 1400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: rgba(197, 160, 89, 0.85);
    }

    .sensor-btn {
      font-family: 'Space Mono', monospace;
      background: rgba(10, 9, 7, 0.75);
      border: 1px solid rgba(197, 160, 89, 0.5);
      color: #f5f0e6;
      padding: 10px 22px;
      font-size: 0.75rem;
      letter-spacing: 2px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .sensor-btn:hover {
      background: rgba(197, 160, 89, 0.2);
      border-color: #c5a059;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND WebGL GLOBE CONTAINER -->
  <div id="canvas-container"></div>

  <!-- HERO CONTENT LAYER -->
  <main class="hero-container">
    
    <header class="header-bar">
      <div class="brand-logo">FLi</div>
      <div>DEFENSE & STRATEGIC ADVISORY</div>
      <div>WASHINGTON D.C.</div>
    </header>

    <section>
      <div class="tag-strip">ACCESS &bull; MOVEMENT &bull; OUTCOME</div>
      <h1 class="hero-title">NETWORK MOBILITY SOLUTIONS.</h1>
      <p class="hero-subtext">
        The network that opens the door, moves the right capability to it, and delivers the outcome — for government and mission-driven problems worldwide.
      </p>
    </section>

    <footer class="footer-bar">
      <div>LAT 7.4°S &nbsp; LON 72.8°W &nbsp; [TRACKING]</div>
      <button class="sensor-btn">&bull; SENSOR VIEW</button>
    </footer>

  </main>

  <!-- THREE.JS WEBGL GLOBE ENGINE -->
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 220;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Main Globe Group
    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    // Inner Dark Globe Sphere
    const sphereGeo = new THREE.SphereGeometry(75, 64, 64);
    const sphereMat = new THREE.MeshPhongMaterial({
      color: 0x16130f,
      emissive: 0x050403,
      shininess: 25,
      transparent: true,
      opacity: 0.92
    });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    globeGroup.add(sphere);

    // Tactical Wireframe Latitude/Longitude Grid
    const gridMat = new THREE.MeshBasicMaterial({
      color: 0xc5a059,
      wireframe: true,
      transparent: true,
      opacity: 0.18
    });
    const gridSphere = new THREE.Mesh(sphereGeo, gridMat);
    gridSphere.scale.setScalar(1.002);
    globeGroup.add(gridSphere);

    // Outer Atmospheric Amber Glow Ring
    const atmosphereGeo = new THREE.SphereGeometry(78, 64, 64);
    const atmosphereMat = new THREE.MeshBasicMaterial({
      color: 0xc5a059,
      side: THREE.BackSide,
      transparent: true,
      opacity: 0.08
    });
    const atmosphere = new THREE.Mesh(atmosphereGeo, atmosphereMat);
    globeGroup.add(atmosphere);

    // Lighting setup for depth
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xc5a059, 1.8);
    keyLight.position.set(120, 150, 180);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x3a2d1d, 0.8);
    fillLight.position.set(-120, -100, -100);
    scene.add(fillLight);

    // Continuous Slow Orbital Rotation
    function animate() {
      requestAnimationFrame(animate);
      globeGroup.rotation.y += 0.0012;
      globeGroup.rotation.x = 0.15;
      renderer.render(scene, camera);
    }
    animate();

    // Responsive Window Resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
